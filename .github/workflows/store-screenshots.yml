name: Capture Play Store screenshots

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/store-screenshots.yml'
      - 'app/src/androidTest/java/com/sammyi57/pdftools/StoreScreenshotsTest.kt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'platforms;android-36-ext19' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build isolated screenshot app and test APK
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -PallAbis -PsideBySide -PstoreScreenshots --stacktrace
          ./gradlew --stop
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 2048
          script: |
            adb shell wm size 1080x1920
            adb shell wm density 360
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 0
            adb install -r app/build/outputs/apk/debug/app-universal-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell am instrument -w -e class com.sammyi57.pdftools.StoreScreenshotsTest com.waseem.pdfpocket.test.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            ! rg -q "FAILURES!!!|INSTRUMENTATION_FAILED|shortMsg=" instrumentation.txt
            adb pull /sdcard/Android/data/com.waseem.pdfpocket.test/files/store-screenshots store-captures
      - name: Capture device logs
        if: always()
        run: adb logcat -d > emulator-log.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-pocket-store-screenshots
          path: |
            store-captures/*.png
            emulator-log.txt
            instrumentation.txt
          retention-days: 14
