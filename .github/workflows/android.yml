name: Android verification

on:
  pull_request:
    branches: [master, feature/pdf-pocket-premium]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform and PDF extension
        run: sdkmanager 'platforms;android-36' 'platforms;android-36-ext19' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify generated support pages and in-app policies
        run: |
          python3 tools/build_support.py
          git diff --exit-code -- docs app/src/main/java/com/sammyi57/pdftools/AppPolicy.kt
      - name: Unit tests and Android compilation
        run: ./gradlew :app:testReleaseUnitTest :app:assembleDebug :app:bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-pocket-test-builds
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/tests/
          retention-days: 14
