name: Android verification

on:
  pull_request:
    branches: [master, feature/pdf-pocket-premium]
  push:
    branches: [feature/form-image-resizing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform and PDF extension
        run: sdkmanager 'platforms;android-36' 'platforms;android-36-ext19' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify generated support pages and in-app policies
        run: |
          python3 tools/build_support.py
          git diff --exit-code -- docs app/src/main/java/com/sammyi57/pdftools/AppPolicy.kt
      - name: Unit tests and Android compilation
        run: ./gradlew :app:testReleaseUnitTest :app:assembleDebug :app:bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-pocket-test-builds
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/tests/
          retention-days: 14

  image-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install compilation platform
        run: sdkmanager 'platforms;android-36' 'platforms;android-36-ext19' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -PallAbis -PsideBySide -PstoreScreenshots -Pandroid.testInstrumentationRunnerArguments.class=com.sammyi57.pdftools.FormImagesTest
